<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美镜 · 新潮慢照 · 呼吸感版 · 页面原型</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230F172A'/%3E%3Ccircle cx='32' cy='30' r='10' fill='none' stroke='%23F59E0B' stroke-width='4'/%3E%3Ccircle cx='32' cy='30' r='3' fill='%23F59E0B'/%3E%3Cpath d='M14 48l8-10M50 48l-8-10' stroke='%23F59E0B' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#0f172a;--amber:#f59e0b;--line:#f1f5f9}
  body{
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    background-color:#fff; color:var(--ink);
    background-image:conic-gradient(#f8fafc 0.25turn,#ffffff 0.25turn 0.5turn,#f8fafc 0.5turn 0.75turn,#ffffff 0.75turn);
    background-size:48px 48px; background-attachment:fixed;
  }
  .text-gold{background:linear-gradient(135deg,#92400e 0%,#d97706 50%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .glass{background:rgba(255,255,255,.7);backdrop-filter:blur(24px);border-bottom:1px solid rgba(15,23,42,.05)}
  .luxury{background:#fff;border:1px solid rgba(15,23,42,.04);transition:transform .5s cubic-bezier(.16,1,.3,1),box-shadow .5s cubic-bezier(.16,1,.3,1);border-color:#fff}
  .luxury:hover{transform:translateY(-4px);box-shadow:0 20px 40px -12px rgba(15,23,42,.08);border-color:rgba(15,23,42,.08)}
  .grad-gold{background:linear-gradient(135deg,#b45309 0%,#f59e0b 50%,#d97706 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .card{background:#fff;border:1px solid #f1f5f9;transition:.4s}
  .card:hover{box-shadow:0 22px 45px -12px rgba(15,23,42,.1)}

  /* ===== 原型工具栏 ===== */
  .proto-bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:999;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:8px 16px;display:flex;align-items:center;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  .proto-bar .tag{font-size:11px;font-weight:900;color:var(--amber);letter-spacing:.15em;margin-right:4px}
  .proto-bar button{border:none;background:transparent;font-size:12px;font-weight:700;color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;transition:.2s}
  .proto-bar button.on{background:var(--ink);color:#fff}
  .proto-bar button:not(.on):hover{background:#f1f5f9}

  .app{max-width:1024px;margin:0 auto;padding:0 0 40px}
  .view{display:none}
  .view.on{display:block}
  .view.on.analyzing{display:flex}

  /* ===== 顶栏 ===== */
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:20px 40px;border-radius:0;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border:none;border-bottom:1px solid rgba(15,23,42,.05);margin-bottom:0}
  .topbar .brand{display:flex;align-items:center;gap:16px}
  .topbar .b-ic{background:var(--ink);padding:10px;border-radius:12px;box-shadow:0 16px 24px rgba(15,23,42,.16);color:#fff}
  .topbar .b-name{font-size:24px;font-weight:900;letter-spacing:-.05em;text-transform:uppercase}
  .topbar .b-name .st{background:var(--ink);color:#fff;font-style:italic;font-weight:900;padding:2px 8px;border-radius:6px;margin-left:4px}
  .topbar .acts{display:flex;align-items:center;gap:16px}
  .key-btn{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border:none;cursor:pointer;transition:.3s}
  .key-btn.active{background:#f1f5f9;color:#64748b}
  .key-btn.setup{background:var(--amber);color:#fff;box-shadow:0 12px 24px rgba(245,158,11,.3);animation:pulse 2s ease-in-out infinite}
  .reset-btn{background:var(--ink);color:#fff;border:none;padding:12px;border-radius:999px;display:none;align-items:center;justify-content:center;cursor:pointer;transition:.25s}
  .reset-btn.show{display:flex}
  .reset-btn:hover{transform:scale(1.1)}

  /* ===== 起始页（V4.0 文字/颜色/悬浮） ===== */
  .upload-wrap{padding:12px}
  .hero{text-align:center;margin:52px 0 60px}
  .hero .eyebrow{font-size:11px;font-weight:900;color:#94a3b8;letter-spacing:.6em;text-transform:uppercase;margin-bottom:24px;margin-left:.6em}
  .hero h2{font-size:60px;line-height:1;font-weight:900;letter-spacing:-.05em}
  .hero h2 br{display:none}
  .hero .sub{color:#64748b;font-size:18px;font-weight:500;margin:20px auto 0}

  .portrait{width:min(288px,72vw);height:min(288px,72vw);margin:0 auto;border-radius:50%;background:#fff;border:4px dashed #e2e8f0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;text-align:center;padding:32px;transition:all .7s ease-out}
  .portrait .plus{width:64px;height:64px;background:var(--ink);color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 30px rgba(15,23,42,.2);margin-bottom:20px;transition:transform .5s}
  .portrait:hover .plus{transform:rotate(12deg)}
  .portrait .p-t{font-size:20px;font-weight:900;letter-spacing:-.025em}
  .portrait .p-s{font-size:10px;font-weight:900;color:#94a3b8;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
  .portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%}
  .portrait .del{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.94);border:none;width:60px;height:60px;border-radius:50%;font-size:0;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 16px 30px rgba(0,0,0,.18);z-index:3;transition:.25s}
  .portrait .del:hover{transform:translate(-50%,-50%) scale(1.1)}
  .portrait.has-img .del{display:flex}
  .portrait.has-img{border-style:solid;border-color:transparent}
  .portrait input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}

  .cfg-grid{display:grid;grid-template-columns:1fr;gap:40px;max-width:768px;margin:48px auto 0}
  .cfg-card{background:#fff;padding:40px;border-radius:40px;border:1px solid #f1f5f9}
  .cfg-lab{display:flex;align-items:center;gap:12px;margin-bottom:32px}
  .cfg-lab svg{color:#94a3b8}
  .cfg-lab span{font-size:10px;font-weight:900;color:#64748b;letter-spacing:.1em;text-transform:uppercase}
  .age-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .age-btn{border:none;padding:14px;border-radius:12px;font-size:13px;font-weight:900;background:#f8fafc;color:#94a3b8;cursor:pointer;transition:.3s}
  .age-btn.on{background:var(--ink);color:#fff;box-shadow:0 14px 28px rgba(15,23,42,.2);transform:scale(1.05)}
  .sel-wrap{position:relative}
  .sel{width:100%;background:#f8fafc;border:none;border-radius:16px;padding:20px 32px;font-size:15px;font-weight:900;color:var(--ink);appearance:none;cursor:pointer;outline:none}
  .sel:focus{box-shadow:0 0 0 3px rgba(15,23,42,.06)}
  .sel-chev{position:absolute;right:32px;top:50%;transform:translateY(-50%) rotate(90deg);color:#cbd5e1;pointer-events:none}

  .cta-zone{max-width:768px;margin:48px auto 0;padding:0 8px}
  .cta{width:100%;border:none;border-radius:32px;padding:32px;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:16px;transition:.4s;cursor:pointer}
  .cta.ready{background:var(--ink);color:#fff;box-shadow:0 30px 60px rgba(15,23,42,.25)}
  .cta.ready:hover{transform:scale(1.02)}
  .cta.dim{background:#f1f5f9;color:#cbd5e1;cursor:not-allowed}

  /* ===== 诊断页 ===== */
  .analyzing{min-height:78vh;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:40px}
  .an-ring{width:190px;height:190px;border-radius:50%;background:conic-gradient(var(--ink),var(--amber),var(--ink));padding:5px;animation:spin 2.4s linear infinite}
  .an-ring .core{width:100%;height:100%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  .an-title{font-size:30px;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
  .an-status{font-size:14px;font-weight:900;color:#94a3b8;letter-spacing:.35em;text-transform:uppercase;opacity:.6;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* ===== 报告页 ===== */
  .result{padding:12px 0}
  /* 大片卡 */
  .hero-card{background:#fff;border-radius:56px;overflow:hidden;margin-bottom:32px}
  .hero-banner{position:relative;min-height:280px;display:flex;align-items:center;background-size:cover;background-position:center}
  .hero-banner .mask{position:absolute;inset:0;background:rgba(15,23,42,.62);backdrop-filter:blur(3px)}
  .hero-banner .hz{position:relative;z-index:2;width:100%;padding:40px 60px}
  .hb-eyebrow{display:flex;align-items:center;gap:20px;margin-bottom:18px}
  .hb-eyebrow .bar{width:60px;height:7px;background:var(--amber);border-radius:99px}
  .hb-eyebrow span{font-size:12px;font-weight:900;color:#fff;letter-spacing:.55em;text-transform:uppercase}
  .hb-title{font-size:52px;font-weight:900;color:#fff;letter-spacing:-.02em;line-height:1}
  .hb-title .en{font-size:24px;font-weight:700;color:rgba(255,255,255,.5);font-style:italic;letter-spacing:0;margin-left:20px}
  .hb-desc{font-size:17px;font-weight:500;color:rgba(255,255,255,.92);max-width:640px;line-height:1.7;margin-top:12px}
  .hero-body{padding:48px 44px}
  .duo{display:grid;grid-template-columns:1fr;gap:36px}
  .duo-item .head{display:flex;align-items:center;gap:18px;margin-bottom:16px}
  .duo-item .head .ic{width:60px;height:60px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#fff}
  .duo-item .head .ic.dark{background:var(--ink)} .duo-item .head .ic.lite{background:#f1f5f9;color:var(--ink)}
  .duo-item .head h4{font-size:22px;font-weight:900;letter-spacing:-.01em;text-transform:uppercase}
  .duo-item p{font-size:16px;color:#475569;font-weight:500;line-height:1.75}
  .celeb{margin-top:36px;padding-top:28px;border-top:1px solid var(--line)}
  .celeb .title{display:flex;align-items:center;gap:16px;margin-bottom:24px}
  .celeb .title svg{color:#cbd5e1}
  .celeb .title h4{font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
  .celeb-grid{display:grid;grid-template-columns:1fr;gap:20px}
  .celeb-card{background:#f8fafc;padding:30px;border-radius:36px;transition:.4s}
  .celeb-card:hover{background:var(--ink);color:#fff;transform:scale(1.03);box-shadow:0 20px 40px rgba(15,23,42,.2)}
  .celeb-card .nm{display:flex;align-items:center;gap:14px;font-size:18px;font-weight:900;margin-bottom:18px}
  .celeb-card .nm .bar{width:8px;height:30px;background:var(--ink);border-radius:99px}
  .celeb-card p{font-size:13px;line-height:1.8;opacity:.7}

  /* 色彩系统 */
  .color-sec{background:#fff;border-radius:56px;overflow:hidden;margin-bottom:32px}
  .color-sec .part{padding:36px 40px}
  .color-sec .part+.part{border-top:1px solid var(--line)}
  .cs-head{display:flex;align-items:center;gap:20px;margin-bottom:28px;padding:0 12px}
  .cs-head .ic{width:72px;height:72px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--ink)}
  .cs-head.dim .ic{background:#e2e8f0;color:#94a3b8}
  .cs-head h3{font-size:26px;font-weight:900;letter-spacing:-.01em;text-transform:uppercase}
  .cs-head .en{font-size:10px;font-weight:900;color:#94a3b8;letter-spacing:.45em;text-transform:uppercase;display:block;margin-top:2px}
  .pal-grid{display:grid;grid-template-columns:1fr;gap:0}
  .pal{display:flex;flex-direction:column;gap:20px;padding:26px 20px;border-radius:28px;transition:.4s}
  .pal:hover{background:#f8fafc}
  .pal-top{display:flex;justify-content:space-between;align-items:flex-start}
  .pal-top .nm h5{font-size:20px;font-weight:900;letter-spacing:-.01em}
  .pal-top .nm .en{display:flex;align-items:center;gap:8px;font-size:9px;font-weight:900;color:var(--amber);letter-spacing:.28em;text-transform:uppercase;margin-top:6px}
  .pal-top .nm .en .d{width:7px;height:7px;border-radius:50%;background:var(--amber)}
  .pal-top .nm .en.w{color:#94a3b8} .pal-top .nm .en.w .d{background:#cbd5e1}
  .pal-badge{width:44px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;box-shadow:0 12px 24px rgba(15,23,42,.2)}
  .pal-badge.w{background:#f1f5f9;color:#94a3b8}
  .swatch-bar{display:flex;height:72px;border-radius:18px;overflow:hidden;box-shadow:0 18px 30px rgba(15,23,42,.1);border:1px solid #fff}
  .swatch-bar .sw{flex:1;transition:flex .5s;position:relative}
  .swatch-bar .sw:hover{flex:3.5}
  .swatch-bar .sw .hx{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4);color:#fff;font-size:10px;font-weight:900;letter-spacing:.1em}
  .swatch-bar .sw:hover .hx{display:flex}
  .pal-note{border-left:4px solid var(--ink);background:#fff;padding:16px;border-radius:14px;font-size:13px;line-height:1.7;font-weight:500;color:#334155}
  .pal-note.w{border-color:#e2e8f0;background:#f8fafc;color:#64748b}

  /* ===== 造型双卡（呼吸感增强 + V4.0 字号） ===== */
  .style-duo{display:grid;grid-template-columns:1fr;gap:44px;margin-bottom:56px}
  .st-card{background:#fff;border-radius:56px;padding:44px 40px;display:flex;flex-direction:column;gap:36px}
  .st-head{display:flex;align-items:center;gap:24px;margin-bottom:14px}
  .st-head .ic{width:66px;height:66px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--ink)}
  .st-head .ic.am{background:var(--amber)}
  .st-head h4{font-size:22px;font-weight:900;letter-spacing:-.01em;text-transform:uppercase}
  .st-head .en{display:flex;align-items:center;gap:10px;font-size:9px;font-weight:900;color:#94a3b8;letter-spacing:.32em;text-transform:uppercase;margin-top:4px}
  .st-head .en .ln{width:30px;height:1px;background:#e2e8f0}
  .st-hero{position:relative;border-radius:40px;padding:38px;text-align:center;color:#fff;background:linear-gradient(135deg,#1e293b,#0f172a);overflow:hidden}
  .st-hero.am{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
  .st-hero small{position:relative;z-index:2;display:block;font-size:10px;font-weight:900;letter-spacing:.5em;text-transform:uppercase;margin-bottom:18px}
  .st-hero.slate small{color:var(--amber)} .st-hero.am small{color:rgba(255,255,255,.85)}
  .st-hero h5{position:relative;z-index:2;font-size:26px;font-weight:900;letter-spacing:-.01em;text-transform:uppercase;line-height:1.25}
  .kv-row{display:grid;grid-template-columns:1fr;gap:26px}
  .kv{display:flex;flex-direction:column;gap:12px}
  .kv small{font-size:9px;font-weight:900;color:#94a3b8;letter-spacing:.16em;text-transform:uppercase}
  .kv b{font-size:14px;font-weight:900;line-height:1.65}
  /* 穿戴蓝图（对应 V4.0 穿戴蓝图值字号 16px） */
  .st-card.wear .kv b{font-size:16px}
  /* 配饰调性（对应 V4.0 配饰调性值字号 13px） */
  .st-card.acc .kv b{font-size:13px;line-height:1.5}
  .kv.dim{border-right:none}
  .swatch-group{display:flex;align-items:center;padding-right:8px}
  .swatch-group .sg{width:50px;height:50px;border-radius:50%;border:4px solid #fff;box-shadow:0 12px 24px rgba(0,0,0,.14);margin-left:-12px;transition:.3s;position:relative;display:flex;align-items:center;justify-content:center}
  .swatch-group .sg:first-child{margin-left:0}
  .swatch-group .sg:hover{transform:scale(1.2);z-index:5}
  .swatch-group .sg .hx{display:none;font-size:9px;font-weight:900;color:#fff;mix-blend-mode:difference}
  .swatch-group .sg:hover .hx{display:block}
  .st-foot{display:flex;justify-content:space-between;align-items:center;gap:24px;border-top:1px solid var(--line);padding-top:28px;margin-top:6px}
  .st-foot .lab{font-size:9px;font-weight:900;color:#94a3b8;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}
  .st-foot .val{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:1.5}
  /* 妆容行：呼吸感行距 */
  .mk-rows{display:flex;flex-direction:column;gap:30px}
  .mk-rows .kv{border-top:1px solid var(--line);padding-top:26px}

  /* 图库 */
  .gallery{margin-bottom:40px}
  .g-head{display:flex;flex-direction:column;gap:20px;padding:0 12px;margin-bottom:28px}
  .g-head h3{font-size:34px;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
  .g-head .sub{display:flex;align-items:center;gap:14px}
  .g-head .sub .ln{width:44px;height:1px;background:var(--ink)}
  .g-head .sub p{font-size:14px;font-weight:500;color:#94a3b8;letter-spacing:.18em;text-transform:uppercase}
  .g-grid{display:grid;grid-template-columns:1fr;gap:28px}
  .g-card{position:relative;border-radius:56px;overflow:hidden;aspect-ratio:3/4;background:#e2e8f0;box-shadow:0 30px 60px -15px rgba(15,23,42,.22)}
  .g-card .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 2s ease-out}
  .g-card:hover .bg{transform:scale(1.1)}
  .g-card .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,.15) 0%,rgba(15,23,42,0) 35%,rgba(15,23,42,.92) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:44px 40px;transform:translateY(30px);transition:.6s}
  .g-card:hover .ov{transform:translateY(0)}
  .g-edition{align-self:flex-start;background:var(--amber);color:var(--ink);padding:10px 28px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.32em;text-transform:uppercase;margin-bottom:22px;box-shadow:0 14px 26px rgba(245,158,11,.35)}
  .g-card h4{font-size:30px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:16px;line-height:1.1}
  .g-card p{color:rgba(255,255,255,.75);font-size:14px;line-height:1.7;max-width:320px;font-weight:500}

  /* 完成卡 */
  .done{background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:72px;padding:56px 32px;text-align:center;position:relative;overflow:hidden}
  .done h4{color:#fff;font-size:34px;font-weight:900;letter-spacing:-.02em;text-transform:uppercase;margin-bottom:18px}
  .done p{color:#94a3b8;font-size:16px;font-weight:500;line-height:2;max-width:600px;margin:0 auto}
  .done .btn{margin-top:28px;border:none;background:#fff;color:var(--ink);font-weight:900;font-size:22px;padding:22px 72px;border-radius:28px;cursor:pointer;transition:.4s;display:inline-flex;align-items:center;gap:20px}
  .done .btn:hover{background:var(--amber);color:#fff}

  /* footer */
  .footer{text-align:center;padding:56px 16px 30px;opacity:.55;transition:.5s}
  .footer:hover{opacity:1}
  .footer .f-brand{display:flex;align-items:center;justify-content:center;gap:16px;font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
  .footer .f-sub{font-size:13px;font-weight:900;color:#64748b;letter-spacing:.5em;text-transform:uppercase;margin-top:14px}
  .footer .f-copy{font-size:11px;color:#94a3b8;margin-top:8px}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:14px 26px;border-radius:16px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:300;box-shadow:0 20px 40px rgba(0,0,0,.25)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (min-width:768px){
    .hero h2{font-size:96px}
    .hero h2 br{display:inline}
    .hero .sub{font-size:20px}
    .hero .sub br{display:inline}

/* 视图切换 */
var views={upload:document.getElementById('view-upload'),analyzing:document.getElementById('view-analyzing'),result:document.getElementById('view-result')};
var navBtns=document.querySelectorAll('.proto-bar button');
function showView(n){
  Object.keys(views).forEach(function(k){views[k].classList.toggle('on',k===n);});
  navBtns.forEach(function(b){b.classList.toggle('on',b.dataset.view===n);});
  var rb=document.getElementById('resetBtn');
  if(rb)rb.classList.toggle('show',n==='result');
  window.scrollTo(0,0);
}
navBtns.forEach(function(b){b.addEventListener('click',function(){showView(b.dataset.view);});});

/* 上传 */
var portrait=document.getElementById('portrait'),fileInput=document.getElementById('fileInput'),delBtn=document.getElementById('delBtn'),hasImage=false;
portrait.addEventListener('click',function(e){if(e.target===delBtn)return;fileInput.click();});
fileInput.addEventListener('change',function(){
  var f=this.files&&this.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var img=document.createElement('img');img.src=rd.result;img.alt='预览';
    portrait.insertBefore(img,delBtn);portrait.classList.add('has-img');
    hasImage=true;updateCta();
  };
  rd.readAsDataURL(f);
});
delBtn.addEventListener('click',function(e){e.stopPropagation();portrait.querySelectorAll('img').forEach(function(i){i.remove();});portrait.classList.remove('has-img');hasImage=false;updateCta();});

/* 年龄段 */
document.querySelectorAll('.age-btn').forEach(function(b){
  b.addEventListener('click',function(){document.querySelectorAll('.age-btn').forEach(function(x){x.classList.remove('on');});b.classList.add('on');});
});

/* CTA */
var startBtn=document.getElementById('startBtn');
function updateCta(){startBtn.classList.toggle('ready',hasImage);startBtn.classList.toggle('dim',!hasImage);}
startBtn.addEventListener('click',function(){if(!hasImage){showToast('请先上传一张肖像');return;}startAnalyzing();});

/* 诊断 */
var anStatus=document.getElementById('anStatus');
function startAnalyzing(){
  showView('analyzing');
  var phases=['深度识别原生条件中...','正在解构三色核心与骨相特征...','执行 PCCS 色彩空间映射...','生成完整美学诊断报告...'];
  var i=0;
  var t=setInterval(function(){
    i++;
    if(i<phases.length)anStatus.textContent=phases[i];
    else{clearInterval(t);renderResult();setTimeout(function(){showView('result');},300);}
  },850);
}

/* Toast */
var toast=document.getElementById('toast'),toastTimer;
function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toast.classList.remove('show');},2200);}
document.querySelectorAll('.key-btn, #resetBtn').forEach(function(b){b.addEventListener('click',function(){if(b.id==='resetBtn'){reset();}else{showToast('API Key 面板：演示中');}});});

/* 重置 */
function reset(){
  hasImage=false;portrait.querySelectorAll('img').forEach(function(i){i.remove();});portrait.classList.remove('has-img');
  updateCta();showView('upload');
}
